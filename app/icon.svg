<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Значок сайта: сцена в одном символе. Тёмный шар А на светлом снегу,
       внутри него светится Б. Ровно то, что видит зритель в первом кадре,
       и ровно то, чем кончается прокрутка.

       Своей графикой, а не файлом: значок обязан читаться в шестнадцать
       пикселей на вкладке, и уменьшенный снимок сцены превратился бы там
       в серое пятно. Цвета взяты те же, что в конфиге, но повторены
       строкой — SVG в app/ обрабатывается сборщиком как статический файл,
       и подставить в него значение из TypeScript нечем. Разойдутся —
       заметно не станет: значок не стоит рядом со сценой. -->
  <rect width="32" height="32" fill="#e8ecef"/>
  <circle cx="16" cy="16" r="10" fill="#5a636e"/>
  <circle cx="16" cy="16" r="2.6" fill="#ffffff"/>
</svg>
